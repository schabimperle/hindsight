name: Screenshots

on: workflow_dispatch

permissions:
  contents: write
  pull-requests: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright-core install --with-deps chromium
      - name: Start a disposable Wealthfolio matching the SDK
        run: |
          version=$(node -p "require('./node_modules/@wealthfolio/addon-sdk/package.json').version")
          docker run -d -p 127.0.0.1:8088:8088 -e WF_LISTEN_ADDR=0.0.0.0:8088 -e WF_AUTH_REQUIRED=false \
            -e WF_SECRET_KEY="$(openssl rand -base64 32)" "wealthfolio/wealthfolio:$version"
      - run: npm run screenshot
        env:
          WEALTHFOLIO_URL: http://127.0.0.1:8088
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="screenshots-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add docs/screenshot-light.png docs/screenshot-dark.png
          git diff --cached --quiet && { echo "Screenshots unchanged"; exit 0; }
          git commit -m "Update screenshots"
          git push origin "$branch"
          gh pr create --title "Update screenshots" --body "Generated by the Screenshots workflow." --base "$GITHUB_REF_NAME"
